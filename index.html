<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KahaniToon - AI Story Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff3e0, #f3e5f5);
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #7b2cbf;
    }

    .tagline {
      color: #666;
      font-size: 18px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #7b2cbf;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      border: 2px dashed #bbb;
      border-radius: 12px;
      background: #fafafa;
    }

    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }

    .preview img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #7b2cbf;
    }

    .styles {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .style {
      padding: 12px 20px;
      border: 2px solid #ddd;
      border-radius: 25px;
      cursor: pointer;
      background: white;
    }

    .style.active {
      background: #7b2cbf;
      color: white;
      border-color: #7b2cbf;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #7b2cbf, #e6399b);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      background: #f3e5f5;
      border-radius: 12px;
      color: #7b2cbf;
      font-weight: bold;
    }

    #videoResult {
      display: none;
      margin-top: 20px;
    }

    #videoResult video {
      width: 100%;
      border-radius: 15px;
      background: #000;
    }

    .watchButton {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #7b2cbf;
      color: white;
      border-radius: 10px;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">🎨 KahaniToon</div>
    <div class="tagline">Apni Kahani Ko Zinda Karo</div>
  </header>

  <div class="card">

    <label>📖 Apni Story Likhein</label>

    <textarea
      id="story"
      placeholder="Yahan apni kahani paste karein...

Example:
Ravi ek chhota ladka tha. Ek din woh jungle mein kho gaya. Wahan uski mulaqat ek friendly sher se hui.">
    </textarea>

  </div>

  <div class="card">

    <label>👤 Character Photos Add Karein</label>

    <p style="color:#666;">
      Character ki photo upload karein. AI video mein is photo ko reference ke roop mein use karega.
    </p>

    <input
      type="file"
      id="photos"
      accept="image/*"
      multiple
    >

    <div class="preview" id="preview"></div>

  </div>

  <div class="card">

    <label>🎨 Video Style</label>

    <div class="styles">

      <div class="style active" onclick="selectStyle(this)">
        Cartoon
      </div>

      <div class="style" onclick="selectStyle(this)">
        3D Animation
      </div>

      <div class="style" onclick="selectStyle(this)">
        Anime
      </div>

      <div class="style" onclick="selectStyle(this)">
        Storybook
      </div>

    </div>

  </div>

  <div class="card">

    <label>🗣️ Voice</label>

    <select
      id="voice"
      style="width:100%; padding:14px; border-radius:10px; border:2px solid #ddd; font-size:16px;"
    >

      <option>Female Narrator</option>
      <option>Male Narrator</option>
      <option>Young Voice</option>
      <option>Deep Story Voice</option>

    </select>

  </div>

  <div class="card">

    <button id="createButton" onclick="createVideo()">
      🎬 CREATE AI VIDEO
    </button>

    <div id="status"></div>

    <div id="videoResult">

      <video id="generatedVideo" controls></video>

      <a
        id="watchButton"
        class="watchButton"
        target="_blank"
        rel="noopener"
      >
        ▶️ Watch Video
      </a>

    </div>

  </div>

  <footer>
    © 2026 KahaniToon • AI Story Video Maker
  </footer>

</div>

<script>

  const photos = document.getElementById("photos");
  const preview = document.getElementById("preview");

  let selectedStyle = "Cartoon";

  photos.addEventListener("change", function () {

    preview.innerHTML = "";

    Array.from(this.files).forEach(file => {

      const reader = new FileReader();

      reader.onload = function(e) {

        const img = document.createElement("img");

        img.src = e.target.result;

        preview.appendChild(img);

      };

      reader.readAsDataURL(file);

    });

  });


  function selectStyle(element) {

    document.querySelectorAll(".style").forEach(item => {

      item.classList.remove("active");

    });

    element.classList.add("active");

    selectedStyle = element.textContent.trim();

  }


  async function createVideo() {

    const story =
      document.getElementById("story").value.trim();

    const voice =
      document.getElementById("voice").value;

    const button =
      document.getElementById("createButton");

    const status =
      document.getElementById("status");

    const videoResult =
      document.getElementById("videoResult");

    const video =
      document.getElementById("generatedVideo");

    const watchButton =
      document.getElementById("watchButton");


    if (!story) {

      alert("Pehle apni story paste karein.");

      return;

    }


    button.disabled = true;

    videoResult.style.display = "none";

    status.style.display = "block";

    status.innerHTML =
      "✨ Story AI ko bheji ja rahi hai...<br><br>" +
      "🎭 Characters prepare ho rahe hain...<br>" +
      "🎬 AI video generate ho raha hai...<br><br>" +
      "⏳ Please wait...";


    try {

      const formData = new FormData();

      formData.append(
        "story",
        story
      );

      formData.append(
        "style",
        selectedStyle
      );

      formData.append(
        "voice",
        voice
      );


      if (photos.files.length > 0) {

        formData.append(
          "photo",
          photos.files[0]
        );

      }


      const response =
        await fetch(
          "/api/generate-video",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Video generation failed."
        );

      }


      if (!data.videoUrl) {

        throw new Error(
          "Video URL nahi mila."
        );

      }


      video.src =
        data.videoUrl;

      watchButton.href =
        data.videoUrl;

      videoResult.style.display =
        "block";

      status.innerHTML =
        "🎉 <strong>Video Ready!</strong><br><br>" +
        "Neeche video play karein.";


    } catch (error) {

      console.error(error);

      status.innerHTML =
        "❌ Video generate nahi ho paya.<br><br>" +
        error.message;

    } finally {

      button.disabled = false;

    }

  }

</script>

</body>
</html>
